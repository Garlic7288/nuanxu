<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;height:100%;background:#f4f4f0;
    font-family:'DM Sans','Microsoft YaHei UI','Microsoft YaHei',sans-serif}
  .row{height:100%;display:flex}
  .pane{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
  .pane+.pane{border-left:1px dashed #dcded5}
  .tagv{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:10px;color:#b0b2a9;letter-spacing:.1em}
  .word{margin-top:24px;font-size:28px;font-weight:700;color:#20221f;letter-spacing:.16em;
    padding-left:.16em;line-height:1}
  .tag{margin-top:13px;font-size:10.5px;color:#8b8d85;letter-spacing:.26em;padding-left:.26em;line-height:1}
  .bar{margin-top:44px;width:132px;height:2px;border-radius:99px;background:#e4e5de;overflow:hidden}
  .bar i{display:block;height:100%;width:58%;border-radius:99px;background:#57745e}
</style></head><body>
<div class="row">
  <div class="pane">
    <div class="tagv">A · 圆角方徽章（与现有图标一致）</div>
    <svg width="84" height="84" viewBox="0 0 64 64">
      <rect x="3" y="3" width="58" height="58" rx="9" fill="#4d6953"/>
      <circle cx="31" cy="32" r="17" fill="#f5daa9"/>
      <circle cx="40" cy="24" r="15" fill="#4d6953"/>
      <circle cx="46" cy="16" r="2.2" fill="#e8b178"/>
    </svg>
    <div class="word">暖序</div>
    <div class="tag">把昼夜，还给眼睛</div>
    <div class="bar"><i></i></div>
  </div>
  <div class="pane">
    <div class="tagv">B · 去底色的月牙</div>
    <svg width="84" height="84" viewBox="0 0 64 64">
      <circle cx="31" cy="32" r="21" fill="#4d6953"/>
      <circle cx="41" cy="23" r="18.5" fill="#f4f4f0"/>
      <circle cx="49" cy="13" r="2.6" fill="#e8b178"/>
    </svg>
    <div class="word">暖序</div>
    <div class="tag">把昼夜，还给眼睛</div>
    <div class="bar"><i></i></div>
  </div>
</div>
</body></html>
